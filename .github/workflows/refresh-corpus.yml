name: Refresh corpus

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild corpus from upstream windows
        run: python data/build_corpus.py
      - name: Commit when the corpus changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/problems.json data/companies.json
          git diff --staged --quiet || git commit -m "Refresh corpus from upstream ask-data" && git push
